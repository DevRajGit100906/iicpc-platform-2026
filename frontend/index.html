<!DOCTYPE html>
<html>
<head>
    <title>IICPC Live Leaderboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0d1117; color: #58a6ff; padding: 40px; }
        h1 { color: #c9d1d9; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        table { width: 80%; border-collapse: collapse; margin-top: 20px; background: #161b22; }
        th, td { border: 1px solid #30363d; padding: 15px; text-align: left; }
        th { background: #21262d; color: #c9d1d9; }
        .live-pulse { color: #3fb950; animation: blinker 1.5s linear infinite; font-weight: bold;}
        @keyframes blinker { 50% { opacity: 0; } }

        /* Dynamic Status Badges */
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .bg-building { background: #d29922; color: #ffffff; }
        .bg-running { background: #238636; color: #ffffff; }
        .bg-finished { background: #8b949e; color: #ffffff; }
        .bg-unknown { background: #21262d; color: #c9d1d9; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Leaderboard() {
            const [board, setBoard] = useState([]);

            useEffect(() => {
                const ws = new WebSocket("ws://localhost:8081/ws");
                ws.onmessage = (event) => {
                    setBoard(JSON.parse(event.data));
                };
                return () => ws.close();
            }, []);

            // Map the Redis state to a CSS color class
            const getStatusClass = (status) => {
                if (status === "BUILDING") return "bg-building";
                if (status === "RUNNING") return "bg-running";
                if (status === "FINISHED") return "bg-finished";
                return "bg-unknown";
            };

            return (
                <div>
                    <h1>IICPC Live Leaderboard <span className="live-pulse">● LIVE</span></h1>
                    <table>
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Run ID</th>
                                <th>Match State</th>
                                <th>Composite Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            {board.map((row, idx) => (
                                <tr key={row.run_id}>
                                    <td>{idx + 1}</td>
                                    <td style={{color: '#c9d1d9'}}>{row.run_id}</td>
                                    <td>
                                        <span className={`status-badge ${getStatusClass(row.status)}`}>
                                            {row.status}
                                        </span>
                                    </td>
                                    <td style={{color: '#d2a8ff', fontWeight: 'bold'}}>{row.score.toFixed(2)}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Leaderboard />);
    </script>
</body>
</html>
