syntax = "proto3";
package iicpc.v1;
option go_package = "github.com/devrajdas/iicpc-platform-2026/schemas/iicpc/v1";
message Order {
  string run_id = 1;
  int64 sequence_number = 2;
  string order_type = 3;
  string side = 4;
  int32 quantity = 5;
  int64 price = 6;
  int64 intended_send_ts = 7;
}
message Ack {
  string run_id = 1;
  int64 sequence_number = 2;
  string status = 3;
  int64 ack_ts = 4;
}
message Telemetry {
  string run_id = 1;
  int64 send_ts = 2;
  int64 ack_ts = 3;
  int32 latency_us = 4;
  string error_code = 5;
}
message RunEvent {
  string run_id = 1;
  string state = 2;
}